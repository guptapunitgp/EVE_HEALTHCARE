services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eve_healthcare
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve_local_only}
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_healthcare"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: ${EVE_DATABASE_URL:-postgresql+psycopg://eve_user:${POSTGRES_PASSWORD:-eve_local_only}@postgres:5432/eve_healthcare}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports: ["8000:8000"]
    volumes:
      - ./backend/credentials:/app/credentials:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  celery:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--beat", "--loglevel=INFO"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: ${EVE_DATABASE_URL:-postgresql+psycopg://eve_user:${POSTGRES_PASSWORD:-eve_local_only}@postgres:5432/eve_healthcare}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
